name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android scaffolding
        run: |
          cp android/app/src/main/kotlin/com/xtrm/launcher/MainActivity.kt /tmp/xtrm-main.kt
          cp android/app/src/main/AndroidManifest.xml /tmp/xtrm-manifest.xml || true
          rm -rf android
          flutter create . --platforms=android --project-name xtrm --org com.xtrm || true
          git checkout -- pubspec.yaml lib/ || true
          rm -f android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts
          mkdir -p android/app/src/main/kotlin/com/xtrm/launcher
          cp /tmp/xtrm-main.kt android/app/src/main/kotlin/com/xtrm/launcher/MainActivity.kt
          cp /tmp/xtrm-manifest.xml android/app/src/main/AndroidManifest.xml || true
          flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
