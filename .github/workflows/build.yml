name: Build XTR-M APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check Android wrapper exists - do NOT regenerate
        run: |
          ls -l android/gradlew android/app/build.gradle* android/app/src/main/kotlin/com/xtrm/launcher/MainActivity.kt
          test -f android/gradlew || { echo "ERROR: android/gradlew missing - restore it locally, do NOT run flutter create in CI"; exit 1; }
      - name: Get packages
        run: flutter pub get
      - name: Generate icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: xtr-m-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
